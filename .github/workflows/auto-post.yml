name: Auto Generate English Blog Post

on:
  schedule:
    - cron: '0 9 * * 3' # Runs every Wednesday at 9:00 AM UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # استبدال إصدار بايثون بإصدار مستقر وداعم لمكتبة google-genai

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests google-genai

      - name: Run Auto Blog Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/auto_blog.py

      - name: Commit and Push Changes to GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "chore: auto generated new blog post" || exit 0
          git push
